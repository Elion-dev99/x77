name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-livenova
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip deploy when Cloudflare secrets are not configured (avoids false failures)
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w apps/web

      - name: Setup D1 database ID
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(node -e "
            const fs = require('fs');
            const cfg = fs.readFileSync('wrangler.jsonc','utf8').replace(/\/\/.*$/gm,'');
            const m = cfg.match(/\"database_id\":\s*\"([^\"]+)\"/);
            console.log(m ? m[1] : '');
          ")
          if [ "$DB_ID" = "REPLACE_WITH_YOUR_D1_ID" ] || [ "$DB_ID" = "00000000-0000-0000-0000-000000000001" ] || [ -z "$DB_ID" ]; then
            echo "Creating D1 database..."
            CREATE_OUT=$(npx wrangler d1 create livenova-db 2>&1) || true
            echo "$CREATE_OUT"
            if echo "$CREATE_OUT" | grep -q "already exists"; then
              LIST_OUT=$(npx wrangler d1 list 2>&1)
              echo "$LIST_OUT"
              NEW_ID=$(echo "$LIST_OUT" | grep livenova-db | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
            else
              NEW_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -1)
            fi
            if [ -n "$NEW_ID" ]; then
              sed -i "s/REPLACE_WITH_YOUR_D1_ID/$NEW_ID/g; s/00000000-0000-0000-0000-000000000001/$NEW_ID/g" wrangler.jsonc
              echo "Updated database_id to $NEW_ID"
            else
              echo "::error::Failed to resolve D1 database ID"
              exit 1
            fi
          fi

      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply livenova-db --remote

      - name: Set JWT secret
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: echo "${JWT_SECRET:-livenova-prod-jwt-secret-change-me}" | npx wrangler secret put JWT_SECRET

      - name: Deploy Worker
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  secrets-missing-notice:
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN == '' || secrets.CLOUDFLARE_ACCOUNT_ID == '' }}
    steps:
      - name: Cloudflare secrets not configured
        run: |
          echo "::warning::Cloudflare deploy skipped — GitHub Secrets are not configured."
          echo ""
          echo "Add these repository secrets to enable auto-deploy:"
          echo "  CLOUDFLARE_API_TOKEN  — https://dash.cloudflare.com/profile/api-tokens"
          echo "  CLOUDFLARE_ACCOUNT_ID — Cloudflare dashboard sidebar"
          echo "  JWT_SECRET (optional) — production JWT signing key"
          echo ""
          echo "Required token permissions: Workers Scripts Edit, D1 Edit, Account Read"
